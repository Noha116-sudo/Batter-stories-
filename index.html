    <title>Lighthouse Stories - AI Character & Scene Creator</title>
    <!-- Babel Standalone for runtime transformations if needed -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      body::-webkit-scrollbar {
        display: none; /* Chrome, Safari and Opera */
      }
    </style>
    <script>
      // Prevents FOUC for dark mode & Defaults to DARK
      try {
        const savedTheme = localStorage.getItem('better-stories-theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
